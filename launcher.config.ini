# DeepSeek Harness 启动器配置
# 语法：key = value，'#' 或 ';' 开头的行为注释。
# 路径可以写相对本文件所在目录的相对路径，也可以写绝对路径。
# 修改后需要重启启动器才会生效。

# ---- 目标仓库 ----

# deepseek-harness 源码目录（相对于本文件所在目录）。
# 这是「默认目录」：界面底部可以从「最近使用」里切换、用“浏览…”挑别的目录，
# 或用 --harness <路径> 在命令行指定；这些临时选择不会改写本文件。
harnessDir = ..\deepseek-harness

# 远端名称；更新时使用该 remote 做 fetch / checkout
remoteName = origin

# remote 不存在时使用的地址，同时用于 tag 查询的兜底
remoteUrl = https://github.com/deepseek-ai/deepseek-harness.git

# 只把以此前缀开头的 tag 视为版本 tag
tagPrefix = dsh-v

# ---- 启动行为 ----

# 启动时检查远端是否发布了本地还没有的新 tag
checkUpdates = true

# Web 服务端口；0 表示由 dsh 自己选择空闲端口
port = 3080

# 更新到新 tag 后执行 pnpm install --frozen-lockfile（新版本可能变更依赖）
installAfterUpdate = true

# 判定为「已是最新」且当前提交已有构建产物时，跳过 pnpm run build，直接 pnpm dsh web。
# 设为 true 则即使已是最新也每次都构建。
buildWhenUpToDate = false

# 无法确认远端 tag 状态时（未开启检查，或检查失败/断网）是否仍然构建。
# true = 保守构建；false = 直接启动（源码有改动时可能跑旧产物）。
buildWhenCheckFailed = true

# 默认的 git 证书后端失败时，回退到 openssl 再试一次（部分 Windows 环境需要）
gitSslFallback = true

# 关闭启动器窗口时同时停止 Web 服务
closeStopsService = true

# ---- 命令 ----

# 完整命令为 `pnpm` + 下面的内容
buildCommand = run build
webCommand = dsh web

# 追加到 web 命令后面的参数，例如：--trusted-host 192.168.1.10:3080
webExtraArgs =

# ---- 界面打开方式 ----
# browser = 由 dsh 自己打开默认浏览器
# app     = 由启动器启动下面的 appCommand（会自动给 web 命令加 --no-open）
# none    = 不打开，只在启动器窗口里显示地址
openTarget = app

# openTarget = app 时执行的命令。{url} 会替换成带 token 的完整地址。
#
# 当前配置：打开已安装的 DeepSeek Harness PWA（即开始菜单「启动」里那个应用）。
# 它固定指向 http://127.0.0.1:3080/，登录靠该 Edge 配置里已存在的持久 cookie，
# 因此端口必须保持 3080；若端口被占用而改用了其它端口，应用会仍指向 3080。
#
# 想让它跟随实际端口并总是带新 token，可改用下面注释里的“例 1”（Edge 应用窗口）：
#   appCommand = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --app="{url}" --profile-directory=Default
#
# 想恢复成默认浏览器打开：把上面的 openTarget 改回 browser。
appCommand = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge_proxy.exe" --profile-directory=Default --app-id=hgiemfgfjhalibdoboikeiepnnjapnpc

# 关闭启动器窗口（或点“停止”）时，一并关闭由它打开的界面应用窗口。
# 只关闭本次启动新打开的那个窗口，只发窗口关闭消息、绝不结束浏览器进程，
# 你的其它浏览窗口不受影响。
closeAppOnExit = true

# 可选的窗口标题关键字。留空时只关闭“本次启动新打开的那个窗口”；
# 填上关键字后，即使应用在启动前就已开着，也会在退出时按标题找到并关闭它。
# DSH 网页的标题是本地化的，例如 “DSH 本地构建” / “DSH Local Build”。
appWindowTitle =

# 单个命令的输出上行到界面（false 时只在日志文件里记录）
echoOutput = true

# ---- 界面 ----
# 启动器窗口主题：auto = 跟随 Windows 的“应用模式”（与 DSH 网页的明暗一致）
# dark / light = 强制指定
theme = auto
